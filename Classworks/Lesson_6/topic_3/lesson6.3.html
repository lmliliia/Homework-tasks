<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Псевдокласи та псевдоелементи</title>
    <style>
        div p:first-child {
            color: chocolate;
        }

        div p:last-of-type {
            color: blue;
        }

        div p:nth-child(2) {
            color: red;
        }

        div p:nth-last-child(2) {
            color: green;
        }

        div p:nth-of-type(2) {
            color: orange;
        }

        div p:nth-last-of-type(5) {
            color: purple;
        }
    </style>
</head>
<body>
<div>
    <p>Lorem ipsum dolor sit.</p>
    <p>Accusantium nam sint voluptates.</p>
    <p>Expedita necessitatibus ut voluptates?</p>
    <p>Accusamus atque deleniti dolore!</p>
    <p>Fugiat minima provident qui!</p>
    <p>Est molestiae officia pariatur.</p>
    <p>Ea earum enim odio.</p>
    <p>Id in rem tempore.</p>
    <span>Lorem.</span><span>Vitae?</span><span>Eius.</span><span>Repellat!</span>
</div>

</body>
</html>
