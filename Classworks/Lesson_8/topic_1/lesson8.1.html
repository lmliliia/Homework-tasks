<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>

        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 50vh;
            background: lightblue;
        }

        .box {
            width: 100px;
            height: 100px;
            background: teal;
        }

        .item-1 {
            align-self: flex-start;
        }

        .item-2 {
            align-self: center;
        }

        .item-3 {
            align-self: flex-end;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="box item-1"></div>
    <div class="box item-2"></div>
    <div class="box item-3"></div>
</div>

</body>
</html>
